services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: insurance-oracle
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      # SYSTIMESTAMP/SYSDATE in PL/SQL and column defaults use the server time zone;
      # it must match the business time zone the application uses.
      TZ: ${ORACLE_TZ:-Europe/Istanbul}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      APP_USER: ${APP_USER:?set APP_USER in .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Full stack: docker compose up --build  ->  http://localhost:4200
  backend:
    build: ./backend
    container_name: insurance-backend
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
      APP_USER: ${APP_USER:?set APP_USER in .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BATCH_SCHEDULING_ENABLED: ${BATCH_SCHEDULING_ENABLED:-true}
      # result files dropped into /app/data/collections/inbox are imported automatically
      BATCH_COLLECTION_POLL_INBOX: ${BATCH_COLLECTION_POLL_INBOX:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data

  frontend:
    build: ./frontend
    container_name: insurance-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  oracle-data:
  app-data:
