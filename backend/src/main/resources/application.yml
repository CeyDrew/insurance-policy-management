spring:
  application:
    name: insurance
  config:
    # Local secrets live in .env (KEY=VALUE, properties-compatible). Template: .env.example
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
    username: ${APP_USER}
    password: ${APP_USER_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.fetch_size: 100
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8080}
