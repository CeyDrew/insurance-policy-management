spring:
  application:
    name: insurance
  config:
    # Local secrets live in .env (KEY=VALUE, properties-compatible). Template: .env.example
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
    username: ${APP_USER}
    password: ${APP_USER_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.fetch_size: 100
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  batch:
    job:
      enabled: false # jobs are started by the scheduler or the REST API, never at startup
    jdbc:
      initialize-schema: never # BATCH_* tables come from Flyway (V10)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: insurance-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
  batch:
    chunk-size: 100
    skip-limit: 100
    renewal-days-ahead: 30
    suspend-after-overdue: 2
    import-dir: ${BATCH_IMPORT_DIR:./data/imports}
    report-dir: ${BATCH_REPORT_DIR:./data/reports}
    scheduling:
      enabled: ${BATCH_SCHEDULING_ENABLED:false}
      cron:
        overdueInstallmentJob: 0 0 1 * * *
        policyExpirationJob: 0 15 1 * * *
        policyRenewalJob: 0 30 1 * * *
        monthlyProductionReportJob: 0 0 6 1 * *
        dashboardRefresh: 0 45 1 * * *

  claims:
    document-dir: ${CLAIM_DOCUMENT_DIR:./data/claim-documents}
    max-document-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8080}
